name: Build Windows EXE

on:
  push:
  workflow_dispatch:

jobs:
  thumb-dll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cross-compile thumbnail provider DLL
        run: |
          pip install ziglang
          python -m ziglang c++ -target x86_64-windows-gnu -shared -O2 -DUNICODE -D_UNICODE \
            thumbprov.cpp thumbprov.def -o PdfUnlockThumb.dll \
            -lgdiplus -lole32 -lshlwapi -ladvapi32 -luser32 -lgdi32 -luuid
      - uses: actions/upload-artifact@v4
        with:
          name: thumb-dll
          path: PdfUnlockThumb.dll

  build:
    needs: thumb-dll
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build app (folder build, fast startup)
        run: pyinstaller --noconfirm --onedir --windowed --name PdfUnlock --icon icon.ico --add-data "icon.png;." --collect-all pymupdf app.py
      - uses: actions/download-artifact@v4
        with:
          name: thumb-dll
          path: dist/PdfUnlock
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: PdfUnlock-windows
          path: dist/PdfUnlock-Setup.exe
